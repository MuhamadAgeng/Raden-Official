<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan</title>
    <style>
        body {
            background: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 100px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 6em;
            margin-bottom: 20px;
            color: #333333;
        }
        p {
            font-size: 1.2em;
            margin: 10px 0;
            line-height: 1.6;
        }
        .error-code {
            font-size: 1.5em;
            color: #333333;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .home-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: #d4af37;
            color: #2c1810;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .home-link:hover {
            background: #f4e4c1;
            transform: translateY(-2px);
        }
        .contact {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p class="error-code">Not Found</p>
        <p>The resource requested could not be found on this server</p>

    </div>
</body>
</html>
